<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pollybuzz Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Pollybuzz</h1>

    <input id="email" type="text" placeholder="Nom d'utilisateur">
    <input id="password" type="password" placeholder="Mot de passe">

    <button onclick="login()">Se connecter</button>
    <button onclick="register()">Créer un compte</button>
    <button onclick="forgotPassword()">Mot de passe oublié</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
